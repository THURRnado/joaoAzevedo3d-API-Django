{% extends "global/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto mt-10">

    <div class="bg-white shadow-md rounded-xl p-8 border border-slate-200">
        <h1 class="text-2xl font-semibold text-center mb-6">Entrar</h1>

        {% if form.errors %}
        <div class="mb-4 p-3 text-sm rounded bg-red-50 text-red-700 border border-red-200">
            Usuário ou senha inválidos. Tente novamente.
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Usuário -->
            <div>
                <label class="block font-medium mb-1">Usuário</label>
                <input type="text" name="username" autofocus required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <!-- Senha -->
            <div>
                <label class="block font-medium mb-1">Senha</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <!-- Botão -->
            <button type="submit"
                    class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition">
                Entrar
            </button>

        </form>

    </div>
</div>
{% endblock %}
